# Generated by ai-eng (template v5): starter CI for a python project.
# It is a starting point: adjust the install and test steps to match how this project builds.
name: ai-eng CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e .; fi
      - name: Test
        run: |
          set +e
          python -m pytest
          code=$?
          if [ "$code" -eq 5 ]; then echo "::warning::pytest collected no tests"; exit 0; fi
          exit "$code"
